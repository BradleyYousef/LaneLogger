{% extends "base.html" %}

{% block title %}
Login - LaneLogger
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h1 class="h3 text-center mb-4">
                    Login
                </h1>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-dark w-100"
                    >
                        Login
                    </button>

                </form>


                <p class="text-center mt-3 mb-0">

                    Don't have an account?

                    <a
                        href="{{ url_for('auth.register') }}"
                    >
                        Register
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
