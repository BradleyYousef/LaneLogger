{% extends "base.html" %}
{% block content %}
<h2>Login</h2>

<form method="post" class="bg-white p-3 border rounded" style="max-width: 400px;">
  <input name="username" class="form-control mb-2" placeholder="Username">
  <input name="password" type="password" class="form-control mb-2" placeholder="Password">
  <button class="btn btn-warning w-100">Login</button>
</form>

{% endblock %}
