{% extends "base.html" %}
{% block content %}

<h1 class="h4 fw-bold mb-3">Create Event</h1>

<form method="post" class="bg-white border rounded p-4">

  <!-- Event Name -->
  <div class="mb-3">
    <label class="form-label">Event Name</label>
    <input type="text" name="name" class="form-control" required>
  </div>

  <!-- Type / Discipline / Age / Gender -->
  <div class="row">
    <div class="col-md-3 mb-3">
      <label class="form-label">Type</label>
      <select name="type" class="form-select" required>
        <option value="Track">Track</option>
        <option value="Field">Field</option>
      </select>
    </div>

    <div class="col-md-3 mb-3">
      <label class="form-label">Discipline</label>
      <select name="discipline" class="form-select" required>
        <option value="100m">100m</option>
        <option value="200m">200m</option>
        <option value="400m">400m</option>
        <option value="800m">800m</option>
        <option value="1500m">1500m</option>
        <option value="Long Jump">Long Jump</option>
        <option value="High Jump">High Jump</option>
        <option value="Shot Put">Shot Put</option>
        <option value="Discus">Discus</option>
        <option value="Javelin">Javelin</option>
      </select>
    </div>

    <div class="col-md-3 mb-3">
      <label class="form-label">Age Group</label>
      <select name="age_group" class="form-select">
        <option value="U10">U10</option>
        <option value="U12">U12</option>
        <option value="U14">U14</option>
        <option value="U16">U16</option>
        <option value="U18">U18</option>
        <option value="Open">Open</option>
      </select>
    </div>

    <div class="col-md-3 mb-3">
      <label class="form-label">Gender Group</label>
      <select name="gender_group" class="form-select">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Mixed">Mixed</option>
      </select>
    </div>
  </div>

  <!-- Date / Location -->
  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">Date</label>
      <input type="text" name="date" class="form-control" placeholder="dd/mm/yyyy">
    </div>

    <div class="col-md-8 mb-3">
      <label class="form-label">Location</label>
      <input type="text" name="location" class="form-control" placeholder="Track name / venue">
    </div>
  </div>

  <!-- Lanes / Heats -->
  <div class="row">
    <div class="col-md-3 mb-3">
      <label class="form-label">
