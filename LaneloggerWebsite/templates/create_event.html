{% extends "base.html" %}
{% block content %}
<h1 class="h4 fw-bold mb-3">Create Event</h1>

<form method="post" class="bg-white border rounded p-4">
  <div class="mb-3">
    <label class="form-label">Event name</label>
    <input type="text" name="name" class="form-control" required>
  </div>
  <div class="row">
    <div class="col-md-3 mb-3">
      <label class="form-label">Type</label>
      <select name="type" class="form-select" required>
        <option value="track">Track</option>
        <option value="field">Field</option>
      </select>
    </div>
    <div class="col-md-3 mb-3">
      <label class="form-label">Discipline</label>
      <input type="text" name="discipline" class="form-control" placeholder="100m, Long Jump..." required>
    </div>
    <div class="col-md-3 mb-3">
      <label class="form-label">Age group</label>
      <input type="text" name="age_group" class="form-control" placeholder="U18, Open">
    </div>
    <div class="col-md-3 mb-3">
      <label class="form-label">Gender group</label>
      <input type="text" name="gender_group" class="form-control" placeholder="Male, Female, Mixed">
    </div>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">Date</label>
      <input type="text" name="date" class="form-control" placeholder="dd/mm/yyyy">
    </div>
    <div class="col-md-8 mb-3">
      <label class="form-label">Location</label>
      <input type="text" name="location" class="form-control" placeholder="Track name / venue">
    </div>
  </div>
  <div class="row">
    <div class="col-md-3 mb-3">
      <label class="form-label">Lanes (track)</label>
      <input type="number" name="lanes" class="form-control" value="8">
    </div>
    <div class="col-md-3 mb-3">
      <label class="form-label">Heats</label>
      <input type="number" name="heats" class="form-control" value="1">
    </div>
  </div>

  <button class="btn btn-warning">Create Event</button>
  <a href="{{ url_for('main.events') }}" class="btn btn-secondary ms-2">Cancel</a>
</form>
{% endblock %}
