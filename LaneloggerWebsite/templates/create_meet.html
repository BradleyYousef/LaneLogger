{% extends "base.html" %}

{% block title %}Create Meet - LaneLogger{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7">

        <h1 class="h3 fw-bold mb-4">
            Create New Meet
        </h1>

        <div class="card shadow-sm">

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Meet Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="2026 School Athletics Carnival"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Date
                        </label>

                        <input
                            type="date"
                            name="date"
                            class="form-control"
                        >

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Location
                        </label>

                        <input
                            type="text"
                            name="location"
                            class="form-control"
                            placeholder="Athletics Track"
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-warning"
                    >
                        Create Meet
                    </button>

                    <a
                        href="{{ url_for('main.meets') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
